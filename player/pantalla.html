<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<style>
body {
  margin:0;
  background:black;
  overflow:hidden;
}

#main {
  position:absolute;
  left:0;
  top:0;
  width:75vw;
  height:100vh;
  background:black;
}

#sidebar {
  position:absolute;
  right:0;
  top:0;
  width:25vw;
  height:100vh;
  background:#111;
  display:flex;
  align-items:center;
  justify-content:center;
}

video, img, iframe {
  width:100%;
  height:100%;
  object-fit:cover;
  border:none;
}
</style>
</head>

<body>

<div id="main">LOADING...</div>
<div id="sidebar"></div>

<script>

const API = "https://tgoo-tv.onrender.com/data";

let dataCache = null;
let mainIndex = 0;
let sidebarIndex = 0;

// ================= FETCH =================
async function getData() {
  try {
    const res = await fetch(API + "?t=" + Date.now(), { cache: "no-store" });
    const data = await res.json();

    if (!data) return;

    dataCache = data;

  } catch (err) {
    console.log("fetch error", err);
  }
}

// ================= MAIN =================
function renderMain() {

  const container = document.getElementById("main");

  if (!dataCache || !dataCache.main || !dataCache.main.length) {
    container.innerHTML = "<h2 style='color:white'>Esperando contenido...</h2>";
    return;
  }

  const item = dataCache.main[mainIndex];

  container.innerHTML = "";

  // ===== VIDEO =====
  if (item.type === "video") {

    const v = document.createElement("video");
    v.src = item.src;
    v.muted = true;
    v.autoplay = true;
    v.playsInline = true;

    v.onended = nextMain;

    v.onloadeddata = () => {
      v.play().catch(()=>{});
    };

    container.appendChild(v);
  }

  // ===== YOUTUBE =====
  else if (item.type === "youtube") {

    let id = "";

    if (item.src.includes("watch?v=")) {
      id = item.src.split("watch?v=")[1].split("&")[0];
    } else {
      id = item.src.split("youtu.be/")[1];
    }

    const iframe = document.createElement("iframe");

    iframe.src =
      `https://www.youtube-nocookie.com/embed/${id}?` +
      `autoplay=1&mute=1&controls=0&rel=0&playsinline=1`;

    iframe.allow = "autoplay; encrypted-media";
    iframe.allowFullscreen = true;

    container.appendChild(iframe);

    // ⚠️ fallback (YouTube no dispara ended en iframe)
    setTimeout(nextMain, 60000); // 60s mejor que 20s
  }

  // ===== IMAGE =====
  else {

    const img = document.createElement("img");
    img.src = item.src;

    container.appendChild(img);

    setTimeout(nextMain, 6000);
  }
}

function nextMain() {
  if (!dataCache || !dataCache.main) return;
  mainIndex = (mainIndex + 1) % dataCache.main.length;
  renderMain();
}

// ================= SIDEBAR =================
function renderSidebar() {

  const container = document.getElementById("sidebar");

  if (!dataCache || !dataCache.sidebar || !dataCache.sidebar.length) {
    container.innerHTML = "";
    return;
  }

  const item = dataCache.sidebar[sidebarIndex];

  container.innerHTML = "";

  if (item.type === "video") {

    const v = document.createElement("video");
    v.src = item.src;
    v.muted = true;
    v.autoplay = true;
    v.loop = true;
    v.playsInline = true;

    container.appendChild(v);

    setTimeout(nextSidebar, 10000);
  }

  else {

    const img = document.createElement("img");
    img.src = item.src;

    container.appendChild(img);

    setTimeout(nextSidebar, 8000);
  }
}

function nextSidebar() {
  if (!dataCache || !dataCache.sidebar) return;
  sidebarIndex = (sidebarIndex + 1) % dataCache.sidebar.length;
  renderSidebar();
}

// ================= LOOP =================
async function loop() {
  await getData();
  renderMain();
  renderSidebar();
}

loop();
setInterval(loop, 5000);

</script>

</body>
</html>
