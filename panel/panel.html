<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TGOO Panel</title>

<style>
body {
  margin:0;
  font-family:sans-serif;
  color:white;
  background:#000;
}

.overlay {
  padding:40px;
}

h1 {
  text-align:center;
  margin-bottom:40px;
}

.container {
  display:flex;
  justify-content:space-around;
}

.box {
  width:40%;
  border:1px dashed rgba(255,255,255,0.3);
  padding:30px;
  text-align:center;
}

.upload-btn {
  background:#ff3b3b;
  padding:10px 20px;
  cursor:pointer;
  display:inline-block;
  margin-top:10px;
}

button {
  background:#ff3b3b;
  color:white;
  border:none;
  padding:10px 20px;
  cursor:pointer;
  margin-top:10px;
}

.status {
  margin-top:10px;
  font-size:14px;
  color:#00ff88;
}

.preview img, .preview video {
  width:100%;
  max-height:150px;
  object-fit:cover;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="overlay">

<h1>🔥 TGOO PANEL</h1>

<div class="container">

<div class="box">
  <h2>MAIN</h2>

  <input type="file" id="mainInput" multiple hidden>
  <div class="upload-btn" onclick="mainInput.click()">Upload</div>

  <div id="mainStatus" class="status"></div>
  <div id="mainPreview" class="preview"></div>

  <button onclick="clearMain()">Limpar</button>
</div>

<div class="box">
  <h2>SIDEBAR</h2>

  <input type="file" id="sidebarInput" multiple hidden>
  <div class="upload-btn" onclick="sidebarInput.click()">Upload</div>

  <div id="sidebarStatus" class="status"></div>
  <div id="sidebarPreview" class="preview"></div>

  <button onclick="clearSidebar()">Limpar</button>
</div>

</div>

<div style="text-align:center; margin-top:40px;">
  <input id="urlInput" placeholder="URL (YouTube, video, imagen)" style="width:60%; padding:10px;">
  <br><br>
  <button onclick="addURL('main')">+ MAIN</button>
  <button onclick="addURL('sidebar')">+ SIDEBAR</button>
</div>

</div>

<script>

const API = "https://tgoo-tv.onrender.com";

// 🔥 WAKE BACKEND
fetch(API + "/data").catch(()=>{});

// ===== UPLOAD =====
mainInput.onchange = () => upload("main");
sidebarInput.onchange = () => upload("sidebar");

async function upload(target) {

  const input = document.getElementById(target + "Input");
  const preview = document.getElementById(target + "Preview");
  const status = document.getElementById(target + "Status");

  status.innerText = "Subiendo...";
  preview.innerHTML = "";

  for (let file of input.files) {

    const formData = new FormData();
    formData.append("files", file); // 🔥 IMPORTANTE

    try {
      await fetch(`${API}/upload/${target}`, {
        method:"POST",
        body:formData
      });

      const url = URL.createObjectURL(file);

      if (file.type.includes("video")) {
        preview.innerHTML += `<video src="${url}" autoplay muted loop></video>`;
      } else {
        preview.innerHTML += `<img src="${url}">`;
      }

    } catch (e) {
      console.log("upload error", e);
    }
  }

  status.innerText = "✔ OK";
}

// ===== URL =====
async function addURL(target) {

  const url = document.getElementById("urlInput").value;

  await fetch(`${API}/upload/url`, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ url, target })
  });

  alert("URL añadida");
}

// ===== CLEAR =====
async function clearMain() {
  await fetch(`${API}/clear/main`, { method:"DELETE" });
  mainPreview.innerHTML = "";
}

async function clearSidebar() {
  await fetch(`${API}/clear/sidebar`, { method:"DELETE" });
  sidebarPreview.innerHTML = "";
}

</script>

</body>
</html>
